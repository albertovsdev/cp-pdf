[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contapdf"
version = "0.1.0"
description = "Conversion de PDFs contables a Excel"
requires-python = ">=3.11"
# pypdfium2 lo usa extract/ocr.py para rasterizar la pagina. Faltaba
# declararlo: en la maquina de desarrollo estaba de antes, asi que
# nueve fases no lo notaron. En una limpia, `pip install -e .` no lo
# traia y el OCR fallaba al importar. Detectado en la 8c.
dependencies = ["pdfplumber", "openpyxl", "flask", "pypdfium2"]

[project.scripts]
contapdf = "contapdf.cli:main"

[tool.setuptools.package-data]
"contapdf.web" = ["templates/*.html"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Los tests 'lento' leen documentos completos (cientos de paginas). No se
# corren en cada ciclo, pero si antes de cada entrega:  pytest -m lento
addopts = "-m 'not lento'"
markers = ["lento: lee documentos completos; excluido por defecto"]
