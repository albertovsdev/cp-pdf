[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contapdf"
version = "0.1.0"
description = "Conversion de PDFs contables a Excel"
requires-python = ">=3.11"
dependencies = ["pdfplumber", "openpyxl", "flask"]

[project.scripts]
contapdf = "contapdf.cli:main"

[tool.setuptools.package-data]
"contapdf.web" = ["templates/*.html"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Los tests 'lento' leen documentos completos (cientos de paginas). No se
# corren en cada ciclo, pero si antes de cada entrega:  pytest -m lento
addopts = "-m 'not lento'"
markers = ["lento: lee documentos completos; excluido por defecto"]
